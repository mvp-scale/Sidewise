# replay: re-runs a parent run's own questions across two committed git refs — never new ask:.
mak:
  goal: The injection fix works               # required — usually the parent run's own goal (mm3 replay --parent/--compare fills this in for you)
  # verb: replay                              # optional — must match the command you run, or the request is sent back
  parent: MM3-0042                             # required — the run whose questions get replayed
  compare: {before: main, after: HEAD}        # required — two refs, or "worktree" for the working tree; files must be committed
  expect: [injection]                         # required — which of the parent's concerns this replay should turn to pass; the answer grades the prediction too
                                               # replay never takes ask:, over:, from:, where: or depth: — it re-runs the parent's own questions
mdl:                                         # optional block; every field inside it is optional too
  why: validate                               # optional — validate | find | debug
  area: auth                                  # optional — data | api | ui | auth | hosting | build | tests
  # stage: post-fix                           # optional — design | build | review | pre-merge | post-fix | release
  # change: fix                               # optional — feature | fix | refactor | dependency | config
  # risk: medium                              # optional — low | medium | high
  # parent: MM3-0001                           # optional — a related run, for lineage (distinct from mak.parent above)
  # problem: Removing the SQL injection in findUser flagged by MM3-0042        # optional — one line, your own words
  # uses:                                     # optional — up to 5 C4 chains: level:name ( -> level:name)*; run `mm3 agent mdl` for the grammar
  #   - component:user-handler -> container:db
  # touches: [userId, findUser]               # optional — up to 5 entities/objects this run is about
  # blast: component                          # optional — code | component | container | system | person
