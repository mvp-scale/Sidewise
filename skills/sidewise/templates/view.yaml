# view <this file>: free — checks the ledger for a prior run of the exact same questions on this code, no call.
# where is the only field view needs; depth/ask are optional here since a partial draft (view before class is
# ready to spend) is exactly what view is for.
side:
  goal: This login handler is safe to merge   # required — one line: what you want to be true
  # verb: view                                # optional — must match the command you run, or the request is sent back
  depth: quick                                # optional — if given, must match the yes/no count below, or class will stop on it later
  where: [src/user.ts:1-3]                    # required — up to 5 path[:start-end] entries
  ask:                                        # optional — a partial draft (even zero categories) is fine for view
    injection:
      pass: no
      1: Is request text placed directly into the SQL query?
      2: Could a caller change what the query does?
wise:                                         # optional block; every field inside it is optional too
  why: validate                               # optional — validate | find | debug
  area: data                                  # optional — data | api | ui | auth | hosting | build | tests
  # stage: build                              # optional — design | build | review | pre-merge | post-fix | release
  # change: fix                               # optional — feature | fix | refactor | dependency | config
  # risk: medium                              # optional — low | medium | high
  # parent: SW-0001                           # optional — a related run, for lineage
