# change: replays a parent run's own questions across two committed git refs — never new ask:.
side:
  goal: The injection fix works               # required — usually the parent run's own goal (sidewise change --parent/--compare fills this in for you)
  # verb: change                              # optional — must match the command you run, or the request is sent back
  parent: SW-0042                             # required — the run whose questions get replayed
  compare: {before: main, after: HEAD}        # required — two refs, or "worktree" for the working tree; files must be committed
                                               # change never takes ask:, over:, from:, where: or depth: — it replays the parent's own questions
wise:                                         # optional block; every field inside it is optional too
  why: validate                               # optional — validate | find | debug
  area: data                                  # optional — data | api | ui | auth | hosting | build | tests
  # stage: build                              # optional — design | build | review | pre-merge | post-fix | release
  # change: fix                               # optional — feature | fix | refactor | dependency | config
  # risk: medium                              # optional — low | medium | high
  # parent: SW-0001                           # optional — a related run, for lineage (distinct from side.parent above)
