# class: one subject, one verdict. Edit goal, where and ask; wise is optional but cheap context.
# side.verb (shown once here, commented) is legal on every verb — it's optional everywhere, not just class.
side:
  goal: This login handler is safe to merge   # required — phrase as the exact claim to prove — wording changes the verdict
  # verb: class                               # optional — must match the command you run, or the request is sent back
  depth: quick                                # required — quick=10, standard=20, thorough=30 yes/no questions (scale/choice don't count)
  where: [src/user.ts:1-3]                    # required — up to 5 path[:start-end] entries — this is ALL the code it sees
                                               # a whole file over ~20,000 chars won't send — name the range instead
                                               # a question about code NOT in where: has nothing to answer from — add it here
                                               # with more than one file, name the one you mean in the question (in `backticks`)
  ask:                                        # required
    injection:
      pass: no                                # every question in this category must answer "no" when things are fine
      1: Is request text placed directly into the SQL query?
      2: Could a caller change what the query does?
      10: Would a standard security scanner flag this code?
    guards:
      pass: yes                               # here, "yes" is the fine answer — don't mix polarity within one category
      need: most                              # optional (default all) — all: every answer clears · most: >= 2/3, none a clear miss · any: at least one
      tags: [sql, backend]                    # optional — up to 3 short tags on this category, kept for later pattern-mining
      3: Is the id checked to be a number before use?
      6: Is the caller compared to the record owner?
      9: Does the query select only needed columns?
    access:
      pass: no
      4: Could one user read another user's record?
      5: Can any caller read any record without a permission check?
    leaks:
      pass: no
      7: Does the error sent back reveal the query?
      8: Does the code log an email address?
    severity:                                 # scale/choice questions don't count toward the depth total (at most 5 across the request)
      pass: [none, low]
      11:
        scale: How severe is the worst issue?
        levels: [none, low, medium, high, critical]
    route:
      pass: [ship]
      12:
        choice: Where should this go?
        options: [ship, fix, block]
    # scope:                                    # optional, recommended (TypeSafe best practice) — the visible-scope probe
    #   pass: yes
    #   13: Can this be answered from the code shown?
wise:                                         # optional block; every field inside it is optional too
  why: validate                               # optional — validate | find | debug
  area: data                                  # optional — data | api | ui | auth | hosting | build | tests
  # stage: build                              # optional — design | build | review | pre-merge | post-fix | release
  # change: fix                               # optional — feature | fix | refactor | dependency | config
  # risk: medium                              # optional — low | medium | high
  # parent: SW-0001                           # optional — a related run, for lineage only (not drill/change's structural parent)
