# Dependabot: weekly update PRs into nightly for npm dependencies and the pinned GitHub Actions.
# Security updates (a known vulnerability) are opened as soon as they're found, independent of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: nightly
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    target-branch: nightly
    schedule:
      interval: weekly
