# The one source for every phrase README.md and mm3lab.dev repeat. npm run check:readme keeps them in step.
tagline: "Knows in 20 ms. Learns in 500."
identity: "The memory and decision layer for coding agents. Every answer is citable."
numbers: []
install:
  claude: "/plugin marketplace add mvp-scale/mm3"
  claudeInstall: "/plugin install mm3@mvp-scale"
  npm: "npm install -g @mvpscale/mm3"
  npmInit: "mm3 init"
  endpoint: "TYPESAFE_BASE_URL=https://api.example.com mm3 class review.yaml"
useCases:
  - { title: "Check a change before you merge it", verb: class }
  - { title: "Prove a fix actually worked", verb: replay }
  - { title: "Find where a problem lives", verb: scan }
  - { title: "Check a design before any code exists", verb: loop }
