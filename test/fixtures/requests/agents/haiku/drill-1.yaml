side:
  goal: Find which step in billing-engine/refunds breaks idempotency
  parent: SW-0070
  from: billing-engine/refunds
  over:
    step:
      - validate request
      - compute amount
      - post ledger entry
  ask:
    step:
      idempotency:
        pass: yes
        1: Does {step} maintain idempotency?
        2: Are duplicate requests handled correctly in {step}?
        3: Is there a deduplication mechanism or check?
        4: Can {step} be safely retried without side effects?
        5: Are idempotency keys or request IDs used?
      state-handling:
        pass: yes
        6: Does {step} correctly handle state changes?
        7: Are partial updates handled safely?
        8: Is state consistency maintained across retries?
        9: Are transactions used appropriately for {step}?
        10: Is rollback behavior correct if {step} fails?
