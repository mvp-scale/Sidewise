mak:
  goal: Find functions that skip auth checks or leak stack traces
  depth: quick
  over:
    file: src/handlers/*.ts
    function: each
  ask:
    file:
      security-relevance:
        pass: yes
        1: Is this handler file dealing with sensitive operations?
        2: Does this file expose external APIs or endpoints?
    function:
      auth-checks:
        pass: no
        3: Does {function} skip authentication checks?
        4: Are authorization checks missing or incomplete?
        5: Is authentication bypassed in any code path?
        6: Does {function} verify user permissions correctly?
      error-handling:
        pass: no
        7: Does {function} leak stack traces in error responses?
        8: Is debugging information or internal details exposed?
        9: Are internal errors logged without proper sanitization?
        10: Could error messages reveal sensitive system details?
