mak:
  goal: Stress-test multi-tenant billing design for boundaries and risk
  depth: quick
  over:
    part:
      - name: api
        story:
          - create invoice
          - list invoices
      - name: billing-engine
        feature:
          - proration
          - refunds
      - name: storage
  ask:
    part:
      design-quality:
        pass: yes
        1: Does {part} have clear and well-defined boundaries?
        2: Are responsibilities well-isolated within {part}?
        3: Is the interface minimal and focused for {part}?
        4: Can {part} be tested independently?
    story:
      testability:
        pass: yes
        5: Is the story {story} independently testable?
        6: Are test scenarios and acceptance criteria clear?
      risk:
        pass:
          - low
          - medium
        7:
          scale: What is the implementation risk level for {story}?
          levels:
            - critical
            - high
            - medium
            - low
    feature:
      testability:
        pass: yes
        8: Is the feature {feature} independently testable?
        9: Are test scenarios and acceptance criteria clear?
      risk:
        pass:
          - low
          - medium
        10:
          scale: What is the implementation risk level for {feature}?
          levels:
            - critical
            - high
            - medium
            - low
