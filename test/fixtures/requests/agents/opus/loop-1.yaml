side:
  goal: the multi-tenant billing design holds up under stress
  depth: quick
  over:
    part:
      - api:
          story:
            - create invoice
            - list invoices
      - billing-engine:
          story:
            - proration
            - refunds
      - storage
  ask:
    part:
      boundaries:
        pass: yes
        1: Does {part} have a single clear responsibility in multi-tenant billing?
        2: Does {part} keep one tenant's data isolated from other tenants?
        3: Does {part} talk to other parts only through a defined interface?
    story:
      testability:
        pass: yes
        4: Can {story} be tested in isolation without a live payment provider?
        5: Does {story} have clear, checkable acceptance criteria?
      risk:
        pass: no
        6: Could {story} charge or show the wrong tenant's amount?
        7: Could a retry of {story} create duplicate money movements?
wise:
  why: validate
  area: data
