side:
  goal: no handler skips auth checks or leaks stack traces
  depth: quick
  over:
    file: src/handlers/*.ts
    function: each
  ask:
    function:
      auth:
        pass: yes
        1: Does {function} verify the caller is authenticated before doing work?
        2: Does {function} check the caller is authorized for the resource it touches?
      leaks:
        pass: no
        3: Can {function} return a stack trace or raw error message to the client?
        4: Does {function} send internal error details in its response body?
wise:
  why: find
  area: auth
