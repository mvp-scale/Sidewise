side:
  goal: src/api/orders.ts:40-90 is safe to merge
  depth: quick
  where:
    - src/api/orders.ts:40-90
  ask:
    injection:
      pass: no
      1: Is any query param concatenated or interpolated into the SQL string?
      2: Can a caller change the SQL structure through a query param?
      3: Is the order id used in SQL without type or format validation?
    safe-sql:
      pass: yes
      4: Are all query values passed as bound parameters or placeholders?
      5: Are sort and filter column names checked against an allow-list?
    access:
      pass: yes
      6: Does the handler check that the caller owns the order before returning it?
      7: Does a missing or unknown order id return a 404 without leaking data?
    leaks:
      pass: no
      8: Are raw database errors or stack traces returned to the client?
      9: Does the response include columns the caller should not see?
      10: Can a caller list other users' orders by guessing ids?
    severity:
      pass: [none, low]
      11:
        scale: How severe is the worst issue in this code?
        levels: [none, low, medium, high, critical]
    verdict:
      pass: [ship]
      12:
        choice: What should happen to this change?
        options: [ship, fix, block]
wise:
  why: validate
  area: api
