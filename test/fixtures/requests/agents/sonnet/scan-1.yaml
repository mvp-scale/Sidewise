mak:
  goal: no function in src/handlers/*.ts skips auth checks or leaks stack traces
  depth: quick
  over:
    file: src/handlers/*.ts
    function: each
  ask:
    function:
      auth-skip:
        pass: no
        1: Does {function} skip verifying the caller is authenticated before doing work?
        2: Does {function} skip checking the caller's authorization or role for the action?
        3: Does {function} have a code path that bypasses an auth check present elsewhere in the file?
      stack-leak:
        pass: no
        4: Does {function} return a raw stack trace or exception object in its response?
        5: Does {function} log or echo internal error details back to the caller?
mdl:
  why: find
  area: auth
