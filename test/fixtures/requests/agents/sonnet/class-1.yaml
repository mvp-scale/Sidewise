side:
  goal: src/api/orders.ts:40-90 is safe to merge as-is
  depth: quick
  where:
    - src/api/orders.ts:40-90
  ask:
    sql-injection:
      pass: no
      1: Does the code build SQL by concatenating or interpolating query params into the query string?
      2: Does the code skip parameterized queries or prepared statements for any query param?
      3: Can a query param reach the SQL string without escaping or type validation?
      4: Does the code trust the id param's type without validating it is the expected type?
      5: Would a crafted query param change the SQL query's structure (e.g. add clauses)?
    access-control:
      pass: no
      6: Does the endpoint return orders without checking the requester owns or may view them?
      7: Does the endpoint skip an authentication check before running the query?
      8: Does the endpoint expose more order fields than the caller should see?
    error-handling:
      pass: no
      9: Does a database error leak the raw SQL or stack trace to the caller?
      10: Does the code skip catching errors from the query call?
    severity:
      pass:
        - low
        - medium
      11:
        scale: Severity of the most serious issue found
        levels:
          - low
          - medium
          - high
          - critical
    verdict:
      pass:
        - ship
      12:
        choice: What should happen to this change?
        options:
          - ship
          - fix
          - block
wise:
  why: validate
  area: api
