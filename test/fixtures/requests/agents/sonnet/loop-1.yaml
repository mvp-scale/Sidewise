side:
  goal: the multi-tenant billing design holds up under stress on boundaries and story risk
  depth: standard
  over:
    part:
      - api:
          story:
            - create invoice
            - list invoices
      - billing-engine:
          story:
            - proration
            - refunds
      - storage
  ask:
    part:
      boundaries:
        pass: yes
        1: Does {part} have a clearly owned data boundary separate from other parts?
        2: Does {part} expose a well-defined interface rather than reaching into other parts' internals?
        3: Can {part} be deployed or scaled independently of the other parts?
    story:
      testability:
        pass: yes
        4: Is {story} testable in isolation without standing up the full system?
        5: Does {story} have a clear, observable success condition?
      risk:
        pass: no
        6: Does {story} carry a risk of double-charging or double-processing a tenant?
        7: Does {story} depend on an external system with no fallback if that system is unavailable?
wise:
  why: find
