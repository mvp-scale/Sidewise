<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
<!-- The WordPress map an agent built in MM3's ledger during the Know beat: the C4 chains it tagged on its runs
     (mdl.uses), grouped by container, each box citing the runs behind it. Nothing here is derived by MM3 from code. -->
  <title id="t">The WordPress map in the ledger</title>
  <desc id="d">The map an agent built in MM3's ledger while working on WordPress 7.1.2, from the C4 chains it tagged on 8 of its runs. System wordpress (MM3-0001) holds three containers. Bootstrap: plugin-hooks (MM3-0001, 0003, 0005, 0006, 0008, 0012) and template-loader (MM3-0001). Data: user-api (MM3-0002, 0005, 0006, 0008, 0012) uses meta-api, which reaches the database (MM3-0002). Render: template-loader (MM3-0003, 0004) feeds post-template (MM3-0003 to 0012), which reaches the theme (MM3-0001, 0003). Plugin-hooks uses user-api and post-template. The change, a persona plugin, touches plugin-hooks, user-api and post-template (MM3-0012). The layers are the agent's own names; every edge cites the runs behind it.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7f93b0"/></marker></defs>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
    .sys{fill:none;stroke:#24344f}.cont{fill:#0b1424;stroke:#24344f}.card{fill:#101b2e;stroke:#24344f}
    .hot{fill:#101b2e;stroke:#ffcd57;stroke-width:1.4}
    .sec{fill:#7f93b0;font-size:11.5px;font-weight:700;letter-spacing:.12em}
    .n{fill:#f5f8ff;font-size:14px;font-weight:600}.r{fill:#7f93b0;font-size:11px}
    .f{stroke:#7f93b0;stroke-width:1.4;fill:none}.cap{fill:#7f93b0;font-size:12.5px}
  </style>
  <rect width="900" height="420" rx="14" fill="#050914"/>
  <text x="18" y="34" font-size="17" font-weight="700" fill="#f5f8ff"><tspan fill="#9bdcff">M</tspan><tspan fill="#b7ff83">M</tspan>3</text>
  <text x="882" y="34" text-anchor="end" font-size="13" font-weight="700" fill="#7f93b0">the map in the ledger · WordPress 7.1.2 · 8 tagged runs</text>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#24344f"/>

  <rect x="18" y="66" width="864" height="300" rx="10" class="sys"/>
  <text x="34" y="88" class="sec">SYSTEM · WORDPRESS</text><text x="218" y="88" class="r mono">0001</text>

  <!-- containers -->
  <rect x="34" y="100" width="266" height="170" rx="8" class="cont"/><text x="48" y="120" class="sec">BOOTSTRAP</text>
  <rect x="317" y="100" width="266" height="170" rx="8" class="cont"/><text x="331" y="120" class="sec">DATA</text>
  <rect x="600" y="100" width="266" height="170" rx="8" class="cont"/><text x="614" y="120" class="sec">RENDER</text>

  <!-- bootstrap -->
  <rect x="48" y="132" width="238" height="54" rx="7" class="hot"/>
  <text x="62" y="155" class="n">plugin-hooks</text><text x="62" y="174" class="r mono">0001 0003 0005 0006 0008 0012</text>
  <rect x="48" y="200" width="238" height="54" rx="7" class="card"/>
  <text x="62" y="223" class="n">template-loader</text><text x="62" y="242" class="r mono">0001</text>

  <!-- data -->
  <rect x="331" y="132" width="238" height="54" rx="7" class="hot"/>
  <text x="345" y="155" class="n">user-api</text><text x="345" y="174" class="r mono">0002 0005 0006 0008 0012</text>
  <rect x="331" y="200" width="238" height="54" rx="7" class="card"/>
  <text x="345" y="223" class="n">meta-api</text><text x="345" y="242" class="r mono">0002 · via user-api</text>

  <!-- render -->
  <rect x="614" y="132" width="238" height="54" rx="7" class="card"/>
  <text x="628" y="155" class="n">template-loader</text><text x="628" y="174" class="r mono">0003 0004</text>
  <rect x="614" y="200" width="238" height="54" rx="7" class="hot"/>
  <text x="628" y="223" class="n">post-template</text><text x="628" y="242" class="r mono">0003 0004 0005–0012</text>

  <!-- endpoints -->
  <rect x="331" y="296" width="238" height="54" rx="7" class="card"/>
  <text x="345" y="319" class="n">database</text><text x="345" y="338" class="r mono">0002</text>
  <rect x="614" y="296" width="238" height="54" rx="7" class="card"/>
  <text x="628" y="319" class="n">theme</text><text x="628" y="338" class="r mono">0001 0003</text>

  <!-- the change -->
  <rect x="48" y="296" width="238" height="54" rx="7" fill="#1a1608" stroke="#ffcd57" stroke-width="1.4"/>
  <text x="62" y="319" class="n" fill="#ffcd57">persona-page · the change</text><text x="62" y="338" class="r mono">0012 · touches the amber boxes</text>

  <!-- edges -->
  <line x1="288" y1="159" x2="327" y2="159" class="f" marker-end="url(#a)"/>
  <line x1="450" y1="188" x2="450" y2="196" class="f" marker-end="url(#a)"/>
  <line x1="450" y1="256" x2="450" y2="292" class="f" marker-end="url(#a)"/>
  <line x1="733" y1="188" x2="733" y2="196" class="f" marker-end="url(#a)"/>
  <line x1="733" y1="256" x2="733" y2="292" class="f" marker-end="url(#a)"/>
  <path d="M167 132 V95 H592 V227 H610" class="f" marker-end="url(#a)"/>

  <text x="450" y="396" text-anchor="middle" class="cap" font-size="13">The agent named the layers; MM3 kept every answer. Each box cites the verdicts behind it.</text>
</svg>
