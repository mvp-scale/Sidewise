<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
<!-- A real change on WordPress 7.1.2, beat by beat, from the ledger (runs MM3-0001..0014): each row is one verdict
     with its run id, so every line is something an agent can cite. Same ground, heading and card style as how-it-works. -->
  <title id="t">A whole change on WordPress, in three beats</title>
  <desc id="d">One agent adds a persona plugin to WordPress 7.1.2 using MM3, in 14 runs and 15 calls for about a tenth of a cent. Know: four runs map WordPress before the goal: boot layers unsure (MM3-0001), user meta unsure (MM3-0002), render chain fail because the range cut off the filter call (MM3-0003), render chain again pass (MM3-0004). Judge: plan v1 fail (MM3-0006), definition of done v1 fail (MM3-0007), a drill finds four missing checks, fail (MM3-0010), definition of done v3: the four new checks pass, overall unsure (MM3-0011). Prove: the committed plugin passes its nine behaviour checks but fails on risk (MM3-0012), a drill into risk flags a header sent after output and feeds (MM3-0013), after the fixes a replay shows nothing regressed, overall unsure (MM3-0014).</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
    .col{fill:#7f93b0;font-size:12px;font-weight:700;letter-spacing:.16em}
    .card{fill:#101b2e;stroke:#24344f}
    .id{fill:#7f93b0;font-size:11.5px}.q{fill:#e6edf7;font-size:13px}.cap{fill:#7f93b0;font-size:12.5px}
    .g{font-size:11px;font-weight:700}
  </style>
  <rect width="900" height="400" rx="14" fill="#050914"/>
  <text x="18" y="34" font-size="17" font-weight="700" fill="#f5f8ff"><tspan fill="#9bdcff">M</tspan><tspan fill="#b7ff83">M</tspan>3</text>
  <text x="882" y="34" text-anchor="end" font-size="13" font-weight="700" fill="#7f93b0">WordPress 7.1.2 · one change · 14 runs · 15 calls · ~$0.0011</text>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#24344f"/>

  <text x="160" y="84" text-anchor="middle" class="col">KNOW</text>
  <text x="450" y="84" text-anchor="middle" class="col">JUDGE</text>
  <text x="740" y="84" text-anchor="middle" class="col">PROVE</text>

  <!-- KNOW -->
  <rect x="18" y="96" width="284" height="248" rx="10" class="card"/><rect x="24" y="96" width="272" height="3" rx="1.5" fill="#9bdcff"/>
  <text x="34" y="124" class="cap">map WordPress before the goal</text>
  <text x="34" y="156" class="id mono">MM3-0001</text><text x="34" y="174" class="q">boot layers</text><text x="286" y="174" text-anchor="end" class="g" fill="#ffcd57">UNSURE</text>
  <text x="34" y="204" class="id mono">MM3-0002</text><text x="34" y="222" class="q">user meta</text><text x="286" y="222" text-anchor="end" class="g" fill="#ffcd57">UNSURE</text>
  <text x="34" y="252" class="id mono">MM3-0003</text><text x="34" y="270" class="q">render chain (range cut short)</text><text x="286" y="270" text-anchor="end" class="g" fill="#ff8d85">FAIL</text>
  <text x="34" y="300" class="id mono">MM3-0004</text><text x="34" y="318" class="q">render chain, right range</text><text x="286" y="318" text-anchor="end" class="g" fill="#b7ff83">PASS</text>

  <!-- JUDGE -->
  <rect x="308" y="96" width="284" height="248" rx="10" class="card"/><rect x="314" y="96" width="272" height="3" rx="1.5" fill="#b7ff83"/>
  <text x="324" y="124" class="cap">the plan failed, then got specific</text>
  <text x="324" y="156" class="id mono">MM3-0006</text><text x="324" y="174" class="q">plan v1</text><text x="576" y="174" text-anchor="end" class="g" fill="#ff8d85">FAIL</text>
  <text x="324" y="204" class="id mono">MM3-0007</text><text x="324" y="222" class="q">definition of done v1</text><text x="576" y="222" text-anchor="end" class="g" fill="#ff8d85">FAIL</text>
  <text x="324" y="252" class="id mono">MM3-0010 · drill</text><text x="324" y="270" class="q">4 checks missing</text><text x="576" y="270" text-anchor="end" class="g" fill="#ff8d85">FAIL</text>
  <text x="324" y="300" class="id mono">MM3-0011</text><text x="324" y="318" class="q">v3: the 4 new checks pass</text><text x="576" y="318" text-anchor="end" class="g" fill="#ffcd57">UNSURE</text>

  <!-- PROVE -->
  <rect x="598" y="96" width="284" height="248" rx="10" class="card"/><rect x="604" y="96" width="272" height="3" rx="1.5" fill="#9bdcff"/>
  <text x="614" y="124" class="cap">fixed what it found, nothing broke</text>
  <text x="614" y="156" class="id mono">MM3-0012</text><text x="614" y="174" class="q">9 behaviour checks pass · risk</text><text x="866" y="174" text-anchor="end" class="g" fill="#ff8d85">FAIL</text>
  <text x="614" y="204" class="id mono">MM3-0013 · drill</text><text x="614" y="222" class="q">header after output, feeds</text><text x="866" y="222" text-anchor="end" class="g" fill="#ff8d85">FAIL</text>
  <text x="614" y="252" class="cap">two fixes committed</text>
  <line x1="614" y1="262" x2="866" y2="262" stroke="#24344f"/>
  <text x="614" y="300" class="id mono">MM3-0014 · replay</text><text x="614" y="318" class="q">0 regressions · risk improved</text><text x="866" y="318" text-anchor="end" class="g" fill="#ffcd57">UNSURE</text>

  <text x="450" y="378" text-anchor="middle" class="cap" font-size="13">Every line is a calibrated verdict with a run id your agent can cite.</text>
</svg>
