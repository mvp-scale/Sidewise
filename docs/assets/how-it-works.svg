<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<!-- How MM3 works, in the demo strip's style (same 900-unit width, ground, rule and MM3 heading): two bands, MAK³ (make, use what is proven: view, class, replay) and MDL³ (model, learn what is missing: scan, drill, loop), across the columns Know, Judge, Prove, over one ledger bar. Every element is visible by default (as in an <img>, on GitHub, in headless renders); the bands ease in once, from a visible state, only when the reader has not asked for reduced motion. -->
  <title id="t">How MM3 works</title>
  <desc id="d">MM3, a Knowledge One system. Six verbs in two bands and three columns. MAK³, make, use what is proven: view is a free lookup of the ledger, class gives one verdict for one subject, replay rechecks after a fix. MDL³, model, learn what is missing: scan sweeps to find where to look, drill digs into one weak spot, loop vets a design before code. The columns are Know, Judge and Prove. One ledger sits under all six and learns.</desc>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    .col{fill:#7f93b0;font-size:12px;font-weight:700;letter-spacing:.16em}
    .band{fill:#0b1424;stroke:#24344f}
    .card{fill:#101b2e;stroke:#24344f}
    .row{font-size:16px;font-weight:600}
    .verb{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;font-size:22px;font-weight:700}
    .cap{fill:#e6edf7;font-size:14.5px}
    @media (prefers-reduced-motion:no-preference){
      .r{animation:r .8s ease-out both}
      .d1{animation-delay:.2s}.d2{animation-delay:.9s}.d3{animation-delay:1.6s}
      @keyframes r{from{opacity:.45;transform:translateY(5px)}to{opacity:1;transform:none}}
    }
  </style>
  <rect width="900" height="520" rx="14" fill="#050914"/>
  <text x="18" y="34" font-size="17" font-weight="700" fill="#f5f8ff">MM<tspan fill="#b7ff83">3</tspan></text>
  <text x="882" y="34" text-anchor="end" font-size="13" font-style="italic" fill="#7f93b0">A Knowledge One system</text>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#24344f"/>

  <text x="166" y="90" text-anchor="middle" class="col">KNOW</text>
  <text x="450" y="90" text-anchor="middle" class="col">JUDGE</text>
  <text x="734" y="90" text-anchor="middle" class="col">PROVE</text>

  <g class="r d1">
    <rect x="18" y="106" width="864" height="160" rx="10" class="band"/>
    <text x="34" y="136" class="row"><tspan fill="#9bdcff" font-weight="800">MAK³</tspan><tspan fill="#f5f8ff"> make</tspan><tspan fill="#7f93b0" font-weight="400">  ·  use what is proven</tspan></text>
    <rect x="34" y="152" width="264" height="96" rx="8" class="card"/><rect x="40" y="152" width="252" height="3" rx="1.5" fill="#9bdcff"/>
    <text x="52" y="192" class="verb" fill="#9bdcff">view</text><text x="52" y="224" class="cap">free lookup of the ledger</text>
    <rect x="318" y="152" width="264" height="96" rx="8" class="card"/><rect x="324" y="152" width="252" height="3" rx="1.5" fill="#9bdcff"/>
    <text x="336" y="192" class="verb" fill="#9bdcff">class</text><text x="336" y="224" class="cap">one subject, one verdict</text>
    <rect x="602" y="152" width="264" height="96" rx="8" class="card"/><rect x="608" y="152" width="252" height="3" rx="1.5" fill="#9bdcff"/>
    <text x="620" y="192" class="verb" fill="#9bdcff">replay</text><text x="620" y="224" class="cap">recheck after a fix</text>
  </g>

  <g class="r d2">
    <rect x="18" y="286" width="864" height="160" rx="10" class="band"/>
    <text x="34" y="316" class="row"><tspan fill="#b7ff83" font-weight="800">MDL³</tspan><tspan fill="#f5f8ff"> model</tspan><tspan fill="#7f93b0" font-weight="400">  ·  learn what is missing</tspan></text>
    <rect x="34" y="332" width="264" height="96" rx="8" class="card"/><rect x="40" y="332" width="252" height="3" rx="1.5" fill="#b7ff83"/>
    <text x="52" y="372" class="verb" fill="#b7ff83">scan</text><text x="52" y="404" class="cap">sweep to find where to look</text>
    <rect x="318" y="332" width="264" height="96" rx="8" class="card"/><rect x="324" y="332" width="252" height="3" rx="1.5" fill="#b7ff83"/>
    <text x="336" y="372" class="verb" fill="#b7ff83">drill</text><text x="336" y="404" class="cap">dig into one weak spot</text>
    <rect x="602" y="332" width="264" height="96" rx="8" class="card"/><rect x="608" y="332" width="252" height="3" rx="1.5" fill="#b7ff83"/>
    <text x="620" y="372" class="verb" fill="#b7ff83">loop</text><text x="620" y="404" class="cap">vet a design before code</text>
  </g>

  <g class="r d3">
    <rect x="18" y="462" width="864" height="40" rx="10" fill="#0e1a2c" stroke="#24344f"/>
    <text x="450" y="487" text-anchor="middle" font-size="14.5" font-weight="700" fill="#f5f8ff">One ledger under all six. It learns.</text>
  </g>
  <rect x=".5" y=".5" width="899" height="519" rx="14" fill="none" stroke="#24344f"/>
</svg>
