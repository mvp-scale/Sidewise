<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="t d">
<!-- MM3's architecture, in the how-it-works style: your agent calls one local engine; its only outside call is
     the classifier API; what it learns stays in your project as one append-only ledger plus a self-healing cache. -->
  <title id="t">MM3 architecture</title>
  <desc id="d">Any coding agent calls MM3 through its MCP tool or the mm3 CLI. MM3 runs on your machine: it reuses answers it already has and pays only for new questions, sent to a TypeSafe-compatible classifier endpoint (typesafe.ai or self-hosted), its only outside call. In your project it reads code and git as evidence, appends every run to log.jsonl, the append-only ledger and the only source of truth, and keeps index.db, a read-only hot cache of the ledger that rebuilds itself and answers lookups in under a millisecond, tested to 100,000 runs. No server, no MM3 account, no telemetry. config.yaml sets the budget cap, endpoint and model, reuse rules and your own mdl fields, and is the one file in .mm3/ that git keeps. MM3's whole footprint in your project is the .mm3/ folder.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7f93b0"/></marker></defs>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace}
    .band{fill:#0b1424;stroke:#24344f}.card{fill:#101b2e;stroke:#24344f}
    .h{fill:#f5f8ff;font-size:16px;font-weight:700}.s{fill:#e6edf7;font-size:13.5px}.m{fill:#7f93b0;font-size:12.5px}
    .lab{fill:#7f93b0;font-size:11px;font-weight:600;letter-spacing:.04em}
    .sec{fill:#7f93b0;font-size:12px;font-weight:700;letter-spacing:.16em}
    .i{fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.f{stroke:#7f93b0;stroke-width:1.5;fill:none}
  </style>
  <rect width="900" height="510" rx="14" fill="#050914"/>
  <text x="18" y="34" font-size="17" font-weight="700" fill="#f5f8ff"><tspan fill="#9bdcff">M</tspan><tspan fill="#b7ff83">M</tspan>3</text>
  <text x="882" y="34" text-anchor="end" font-size="13" font-weight="700" fill="#7f93b0">how it runs</text>
  <line x1="0" y1="52" x2="900" y2="52" stroke="#24344f"/>

  <!-- row 1: agent · engine · classifier -->
  <rect x="18" y="72" width="210" height="104" rx="10" class="card"/><rect x="24" y="72" width="198" height="3" rx="1.5" fill="#f5f8ff"/>
  <g transform="translate(34 88)" class="i" stroke="#f5f8ff"><rect x="1" y="3" width="26" height="22" rx="4"/><path d="M7 11l4 3-4 3M14 19h7"/></g>
  <text x="72" y="108" class="h">Your agent</text>
  <text x="34" y="140" class="s">any coding agent</text>
  <text x="34" y="162" class="m">MCP tool or CLI</text>

  <rect x="284" y="72" width="330" height="104" rx="10" class="card"/><rect x="290" y="72" width="318" height="3" rx="1.5" fill="#9bdcff"/>
  <g transform="translate(300 88)" class="i" stroke="#9bdcff"><path d="M14 2l12 6v14l-12 6-12-6V8z"/><path d="M2 8l12 6 12-6M14 14v14"/></g>
  <text x="338" y="108" class="h">MM3</text>
  <text x="602" y="108" text-anchor="end" class="m">runs on your machine</text>
  <text x="300" y="140" class="s mono" font-size="12.5"><tspan fill="#9bdcff">request</tspan> → reuse → ask → <tspan fill="#9bdcff">verdict</tspan></text>
  <text x="300" y="162" class="m">pays only for what it doesn't already know</text>

  <line x1="643" y1="72" x2="643" y2="114" stroke="#ffcd57" stroke-dasharray="4 5" opacity=".7"/>
  <line x1="643" y1="168" x2="643" y2="178" stroke="#ffcd57" stroke-dasharray="4 5" opacity=".7"/>

  <rect x="672" y="72" width="210" height="104" rx="10" class="card"/><rect x="678" y="72" width="198" height="3" rx="1.5" fill="#ffcd57"/>
  <g transform="translate(688 88)" class="i" stroke="#ffcd57"><path d="M8 24h14a6 6 0 0 0 0-12 8 8 0 0 0-15-2A6 6 0 0 0 8 24z"/></g>
  <text x="726" y="108" class="h">Classifier</text>
  <text x="688" y="140" class="s">any TypeSafe endpoint</text>
  <text x="688" y="162" class="m">typesafe.ai or self-hosted</text>

  <text x="256" y="120" text-anchor="middle" class="lab">request</text>
  <line x1="230" y1="128" x2="280" y2="128" class="f" marker-end="url(#a)"/>
  <line x1="280" y1="146" x2="230" y2="146" class="f" marker-end="url(#a)"/>
  <text x="256" y="162" text-anchor="middle" class="lab">verdict</text>
  <text x="643" y="124" text-anchor="middle" class="lab" fill="#ffcd57">new</text>
  <line x1="616" y1="128" x2="668" y2="128" class="f" marker-end="url(#a)"/>
  <line x1="668" y1="146" x2="616" y2="146" class="f" marker-end="url(#a)"/>
  <text x="643" y="162" text-anchor="middle" class="lab" fill="#ffcd57">answers</text>

  <!-- row 2: your project; MM3's whole footprint is the .mm3/ folder -->
  <rect x="18" y="214" width="864" height="252" rx="10" class="band"/>
  <text x="34" y="240" class="sec">YOUR PROJECT</text>

  <rect x="34" y="282" width="258" height="110" rx="8" class="card"/><rect x="40" y="282" width="246" height="3" rx="1.5" fill="#f5f8ff"/>
  <g transform="translate(48 298)" class="i" stroke="#f5f8ff"><path d="M2 7a2 2 0 0 1 2-2h6l3 3h11a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></g>
  <text x="86" y="318" class="h">Code + git</text>
  <text x="48" y="350" class="s">the evidence</text>
  <text x="48" y="372" class="m">read-only · <tspan class="mono">where:</tspan> slices, git refs</text>

  <rect x="306" y="252" width="560" height="200" rx="10" fill="none" stroke="#b7ff83" stroke-opacity=".45" stroke-dasharray="4 5"/>
  <text x="320" y="272" class="mono" font-size="13.5" font-weight="700" fill="#b7ff83">.mm3/</text>
  <text x="370" y="272" class="m">all of MM3 in your project</text>

  <rect x="320" y="282" width="258" height="110" rx="8" class="card"/><rect x="326" y="282" width="246" height="3" rx="1.5" fill="#b7ff83"/>
  <g transform="translate(334 298)" class="i" stroke="#b7ff83"><rect x="3" y="1" width="20" height="26" rx="3"/><path d="M8 8h10M8 13h10M8 18h6"/></g>
  <text x="372" y="318" class="h mono" font-size="14.5">log.jsonl</text>
  <text x="334" y="350" class="s">the ledger · source of truth</text>
  <text x="334" y="372" class="m">append-only · one line per run</text>

  <rect x="594" y="282" width="258" height="110" rx="8" class="card"/><rect x="600" y="282" width="246" height="3" rx="1.5" fill="#b7ff83"/>
  <g transform="translate(608 298)" class="i" stroke="#b7ff83"><ellipse cx="13" cy="6" rx="10" ry="4"/><path d="M3 6v16c0 2.2 4.5 4 10 4s10-1.8 10-4V6M3 14c0 2.2 4.5 4 10 4s10-1.8 10-4"/></g>
  <text x="646" y="318" class="h mono" font-size="14.5">index.db</text>
  <text x="608" y="350" class="s">hot cache · heals itself</text>
  <text x="608" y="372" class="m">sub-ms lookups · tested to 100k runs</text>

  <line x1="580" y1="344" x2="590" y2="344" class="f" marker-end="url(#a)"/>

  <rect x="320" y="402" width="532" height="38" rx="8" class="card"/>
  <g transform="translate(332 409)" class="i" stroke="#9bdcff"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></g>
  <text x="364" y="426" class="mono" font-size="13.5" font-weight="700" fill="#9bdcff">config.yaml</text>
  <text x="466" y="426" class="s" font-size="12.5">budget · endpoint + model · reuse rules · your fields</text>

  <!-- engine <-> project -->
  <line x1="163" y1="278" x2="320" y2="180" class="f" marker-end="url(#a)"/>
  <text x="200" y="206" class="lab">reads</text>
  <line x1="449" y1="180" x2="449" y2="248" class="f" marker-end="url(#a)"/>
  <text x="457" y="206" class="lab">appends</text>
  <line x1="723" y1="278" x2="590" y2="180" class="f" marker-end="url(#a)"/>
  <text x="664" y="206" class="lab">reuse</text>

  <text x="450" y="490" text-anchor="middle" class="m" font-size="13">One folder. One file of truth. One call out, only for what's new. No server, no MM3 account, no telemetry.</text>
</svg>
