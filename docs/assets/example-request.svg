<text x="26" y="498" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#ffcd57">10</tspan>:</text>
<text x="26" y="514" font-size="12" fill="#e6edf7" xml:space="preserve">          <tspan fill="#9bdcff">choice</tspan>: Is Abilities API suitable as the foundation for AUI?</text>
<text x="26" y="530" font-size="12" fill="#e6edf7" xml:space="preserve">          <tspan fill="#9bdcff">options</tspan>: [yes, partial, no]</text>
