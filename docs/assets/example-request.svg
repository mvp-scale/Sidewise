<text x="26" y="178" font-size="12" fill="#e6edf7" xml:space="preserve">  <tspan fill="#9bdcff">ask</tspan>:</text>
<text x="26" y="194" font-size="12" fill="#e6edf7" xml:space="preserve">    <tspan fill="#9bdcff">concerns</tspan>:</text>
<text x="26" y="210" font-size="12" fill="#e6edf7" xml:space="preserve">      <tspan fill="#9bdcff">design</tspan>:</text>
<text x="26" y="226" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#9bdcff">pass</tspan>: &quot;yes&quot;</text>
<text x="26" y="242" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#ffcd57">1</tspan>: Does Abilities API register capabilities with input/output schemas?</text>
<text x="26" y="258" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#ffcd57">2</tspan>: Are abilities required to define permission callbacks before execution?</text>
<text x="26" y="274" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#ffcd57">3</tspan>: Can third-party code register abilities without modifying WordPress core?</text>
<text x="26" y="290" font-size="12" fill="#e6edf7" xml:space="preserve">      <tspan fill="#9bdcff">access</tspan>:</text>
<text x="26" y="306" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#9bdcff">pass</tspan>: &quot;yes&quot;</text>
<text x="26" y="322" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#ffcd57">4</tspan>: Is the permission_callback required for every registered ability?</text>
<text x="26" y="338" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#ffcd57">5</tspan>: Are ability schemas validated against the permission callback result?</text>
<text x="26" y="354" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#ffcd57">6</tspan>: Can an unprivileged user bypass ability permission checks via API?</text>
<text x="26" y="370" font-size="12" fill="#e6edf7" xml:space="preserve">      <tspan fill="#9bdcff">correctness</tspan>:</text>
<text x="26" y="386" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#9bdcff">pass</tspan>: &quot;yes&quot;</text>
<text x="26" y="402" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#ffcd57">7</tspan>: Are input parameters validated against the input_schema?</text>
<text x="26" y="418" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#ffcd57">8</tspan>: Are output values validated against the output_schema?</text>
<text x="26" y="434" font-size="12" fill="#e6edf7" xml:space="preserve">        <tspan fill="#ffcd57">9</tspan>: Does the system reject invalid inputs before executing the callback?</text>
