<text x="26" y="594" font-size="12" fill="#e6edf7" xml:space="preserve">          <tspan fill="#9bdcff">scale</tspan>: How mature is the Abilities API design for agents?</text>
<text x="26" y="610" font-size="12" fill="#e6edf7" xml:space="preserve">          <tspan fill="#9bdcff">levels</tspan>: [prototype, developing, mature, stable]</text>
