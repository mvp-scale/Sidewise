<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" style="text-rendering:geometricPrecision">
  <title id="title">System One works. You own its problems. Knowledge One solves each one.</title>
  <desc id="desc">Top lane: your prompt goes through tokenization and a System One classifier you don't control, a single yes or no comes back and the code ships, with drifting wording, one angle, no trace, no memory, and paying again. Bottom lane: Sidewise sends a standard YAML request, validates and annotates it for free, checks the ledger index for a reusable answer, routes to the System One of your choice, returns a verdict per concern with the odds in one call, appends everything to an append-only ledger, and indexes it in SQLite as a cache and a knowledge base you can build on.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1424"/><stop offset="1" stop-color="#050914"/></linearGradient>
    <linearGradient id="sky"><stop stop-color="#9bdcff"/><stop offset="1" stop-color="#62bde9"/></linearGradient>
    <linearGradient id="amber"><stop stop-color="#ffe49c"/><stop offset="1" stop-color="#ffbd4a"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#93a7bd"/></marker>
    <marker id="garrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4z" fill="#9cff63"/></marker>
  </defs>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .h{fill:#f5f8ff;font-size:21px;font-weight:780}.lane{fill:#f5f8ff;font-size:15px;font-weight:720}.sub{fill:#93a7bd;font-size:13px}
    .box{fill:#132036;stroke:#2a3b58;stroke-width:1.5}.bt{fill:#e8eefb;font-size:11.5px;font-weight:700}.bs{fill:#93a7bd;font-size:10.5px}
    .s1{fill:url(#amber);stroke:#ffd166;stroke-width:2}
    .bad{fill:#ff8fa0;font-size:10.5px}.good{fill:#b7ff83;font-size:10.5px}
    .pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{0%,100%{fill-opacity:.35}45%{fill-opacity:.8}}
    .dotA{animation:dotA 7s cubic-bezier(.4,0,.2,1) infinite}@keyframes dotA{0%{opacity:0;transform:translateX(0)}4%{opacity:1}70%{opacity:1;transform:translateX(828px)}76%,100%{opacity:0;transform:translateX(828px)}}
    .dotB{animation:dotB 10s cubic-bezier(.4,0,.2,1) infinite}@keyframes dotB{0%{opacity:0;transform:translateX(0)}3%{opacity:1}72%{opacity:1;transform:translateX(966px)}78%,100%{opacity:0;transform:translateX(966px)}}
    .chip{opacity:0;animation:chip 10s ease-out infinite}@keyframes chip{0%,6%{opacity:0;transform:translateY(6px)}12%,94%{opacity:1;transform:translateY(0)}100%{opacity:0}}
    .c2{animation-delay:.9s}.c3{animation-delay:1.8s}.c4{animation-delay:2.7s}.c6{animation-delay:4.5s}.c7{animation-delay:5.4s}.c8{animation-delay:6.3s}
    .q{opacity:0;animation:q 7s ease-in-out infinite}@keyframes q{0%,70%{opacity:0}76%,96%{opacity:1}100%{opacity:0}}
    .loop{stroke-dasharray:900;stroke-dashoffset:900;animation:loop 10s ease-in-out infinite}@keyframes loop{0%,72%{stroke-dashoffset:900;opacity:0}86%,96%{stroke-dashoffset:0;opacity:.9}100%{opacity:0}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.dotA,.dotB{opacity:0}.chip,.q{opacity:1}.loop{stroke-dashoffset:0;opacity:.7}.pulse{fill-opacity:.5}}
  </style>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="520" rx="22" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <text x="40" y="58" class="h">System One works. You own its problems.</text>
  <text x="1160" y="58" text-anchor="end" class="h" style="fill:#b7ff83">Knowledge One solves each one.</text>

  <rect x="446" y="120" width="272" height="74" rx="16" fill="#ffd166" fill-opacity=".04" stroke="#ffd166" stroke-opacity=".35" stroke-dasharray="6 6"/>
  <rect x="584" y="320" width="134" height="74" rx="16" fill="#ffd166" fill-opacity=".04" stroke="#ffd166" stroke-opacity=".35" stroke-dasharray="6 6"/>
  <text x="582" y="112" text-anchor="middle" class="bs" style="fill:#ffd166">the model: not in your control</text>
  <text x="651" y="410" text-anchor="middle" class="bs" style="fill:#ffd166">same model, your choice</text>

  <text x="40" y="100" class="lane">System One alone</text>
  <line x1="158" y1="157" x2="450" y2="157" stroke="#93a7bd" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 5"/>
  <line x1="572" y1="157" x2="590" y2="157" stroke="#93a7bd" stroke-opacity=".45" stroke-width="2"/>
  <line x1="710" y1="157" x2="728" y2="157" stroke="#93a7bd" stroke-opacity=".45" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="848" y1="157" x2="866" y2="157" stroke="#93a7bd" stroke-opacity=".45" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="130" width="118" height="54" rx="12" class="box"/><text x="99" y="153" text-anchor="middle" class="bt">your prompt</text><text x="99" y="170" text-anchor="middle" class="bs">free-form text</text>
  <rect x="454" y="130" width="118" height="54" rx="12" class="box"/><text x="513" y="153" text-anchor="middle" class="bt">tokenize</text><text x="513" y="170" text-anchor="middle" class="bs">their tokenizer</text>
  <g class="pulse" filter="url(#glow)"><rect x="592" y="130" width="118" height="54" rx="14" class="s1" fill-opacity=".35"/></g><text x="651" y="162" text-anchor="middle" fill="#2b2107" font-size="15" font-weight="850">System One</text>
  <rect x="730" y="130" width="118" height="54" rx="12" class="box"/><text x="789" y="153" text-anchor="middle" class="bt">yes / no</text><text x="789" y="170" text-anchor="middle" class="bs">one answer</text>
  <rect x="868" y="130" width="118" height="54" rx="12" class="box"/><text x="927" y="153" text-anchor="middle" class="bt">code ships</text><text x="927" y="170" text-anchor="middle" class="bs">and that's it</text>
  <g class="dotA"><circle cx="99" cy="157" r="7" fill="url(#sky)"/></g>
  <g class="q"><circle cx="1036" cy="157" r="17" fill="#ff5d73" fill-opacity=".9"/><text x="1036" y="164" text-anchor="middle" fill="#fff" font-size="19" font-weight="850">?</text><text x="1036" y="196" text-anchor="middle" class="bad">wrong? why?</text></g>
  <text class="bad"><tspan x="40" y="206">✗ wording drifts</tspan><tspan x="40" dy="14">   run to run</tspan></text>
  <text class="bad"><tspan x="730" y="206">✗ one angle,</tspan><tspan x="730" dy="14">   no odds</tspan></text>
  <text class="bad"><tspan x="868" y="206">✗ no trace, no memory</tspan><tspan x="868" dy="14">✗ pay again next time</tspan></text>

  <text x="40" y="300" class="lane" style="fill:#b7ff83">+ Knowledge One (Sidewise)</text>
  <line x1="158" y1="357" x2="1004" y2="357" stroke="#93a7bd" stroke-opacity=".45" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="40" y="330" width="118" height="54" rx="12" class="box"/><text x="99" y="353" text-anchor="middle" class="bt">standard request</text><text x="99" y="370" text-anchor="middle" class="bs">compact YAML</text>
  <rect x="178" y="330" width="118" height="54" rx="12" class="box"/><text x="237" y="353" text-anchor="middle" class="bt">validate + annotate</text><text x="237" y="370" text-anchor="middle" class="bs">free, no call</text>
  <rect x="316" y="330" width="118" height="54" rx="12" class="box"/><text x="375" y="353" text-anchor="middle" class="bt">reuse check</text><text x="375" y="370" text-anchor="middle" class="bs">from the index</text>
  <rect x="454" y="330" width="118" height="54" rx="12" class="box"/><text x="513" y="353" text-anchor="middle" class="bt">router</text><text x="513" y="370" text-anchor="middle" class="bs">pick a System One</text>
  <g class="pulse" filter="url(#glow)"><rect x="592" y="330" width="118" height="54" rx="14" class="s1" fill-opacity=".35"/></g><text x="651" y="362" text-anchor="middle" fill="#2b2107" font-size="15" font-weight="850">System One</text>
  <rect x="730" y="330" width="118" height="54" rx="12" class="box"/><text x="789" y="353" text-anchor="middle" class="bt">verdict per concern</text><text x="789" y="370" text-anchor="middle" class="bs">goal, odds, consensus</text>
  <rect x="868" y="330" width="118" height="54" rx="12" class="box"/><text x="927" y="353" text-anchor="middle" class="bt">ledger</text><text x="927" y="370" text-anchor="middle" class="bs">append-only record</text>
  <rect x="1006" y="330" width="118" height="54" rx="12" class="box" style="stroke:#9cff63;stroke-opacity:.6"/><text x="1065" y="353" text-anchor="middle" class="bt">SQLite index</text><text x="1065" y="370" text-anchor="middle" class="bs">cache + knowledge</text>
  <g class="dotB"><circle cx="99" cy="357" r="7" fill="url(#sky)"/></g>
  <path class="loop" d="M1065 328 C 1060 292, 390 292, 377 326" fill="none" stroke="#9cff63" stroke-width="2.5" marker-end="url(#garrow)"/>
  <text x="720" y="290" text-anchor="middle" class="good">next ask starts smarter</text>
  <text class="good chip"><tspan x="40" y="406">✓ one standard shape</tspan><tspan x="40" dy="14">✓ ⅓ fewer tokens than</tspan><tspan x="40" dy="14">   hand-written JSON</tspan></text>
  <text class="good chip c2"><tspan x="178" y="406">✓ bad requests stopped</tspan><tspan x="178" dy="14">   before they cost</tspan><tspan x="178" dy="14">✓ the why is recorded</tspan></text>
  <text class="good chip c3"><tspan x="316" y="406">✓ never pay twice</tspan><tspan x="316" dy="14">   for a known answer</tspan></text>
  <text class="good chip c4"><tspan x="454" y="406">✓ your choice of</tspan><tspan x="454" dy="14">   System One</tspan></text>
  <text class="good chip c6"><tspan x="730" y="406">✓ many angles, one call</tspan><tspan x="730" dy="14">✓ unsure beats a guess</tspan></text>
  <text class="good chip c7"><tspan x="868" y="406">✓ every answer and</tspan><tspan x="868" dy="14">   correction, traceable</tspan></text>
  <text class="good chip c8"><tspan x="1006" y="406">✓ patterns, quality,</tspan><tspan x="1006" dy="14">   security: build on it</tspan></text>

  <text x="600" y="512" text-anchor="middle" class="sub">A System One needs a Knowledge One. That's Sidewise.</text>
</svg>
