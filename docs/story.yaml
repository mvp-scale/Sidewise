# The one source for every phrase README.md and mm3lab.dev repeat. npm run check:readme keeps them in step.
tagline: "Checklists in. Calibrated verdicts out."
identity: "MM3 turns a short numbered yes/no checklist into a calibrated pass/fail/unsure verdict your coding agent can cite."
numbers:
  - text: "$0.000065 per check (median of five paid class runs)"
    method: docs/numbers.md#cost-per-check
  - text: "1,181 tests, no network, no key"
    method: docs/numbers.md#test-count
  - text: "The expected verb and depth chosen on 12/12 tasks of an agent smoke test on OWASP NodeGoat"
    method: docs/numbers.md#agent-smoke-score
install:
  claude: "/plugin marketplace add mvp-scale/mm3"
  claudeInstall: "/plugin install mm3@mvp-scale"
  npm: "npm install -g @mvpscale/mm3"
  npmInit: "mm3 init"
  endpoint: "MM3_BASE_URL=https://api.example.com mm3 class review.yaml"
useCases:
  - { title: "Check a change before you merge it", verb: class }
  - { title: "Prove a fix actually worked", verb: replay }
  - { title: "Find where a problem lives", verb: scan }
  - { title: "Check a design before any code exists", verb: loop }
