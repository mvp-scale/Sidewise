mak:
  goal: The ledger-folder lookup in `paths.ts` is safe to merge
  depth: quick
  where: [src/ledger/paths.ts:47-72]
  ask:
    concerns:
      correctness:
        pass: yes
        1: Does `findRoot` begin its search at the given `cwd`?
        2: Does `findRoot` stop at the first folder holding `.mm3` or `.git`?
        3: Does `findRoot` return undefined once it reaches the filesystem root?
      input:
        pass: yes
        4: Is `MM3_HOME` read from the `env` argument rather than a global?
        5: Is the `MM3_HOME` value made absolute before it is used?
        6: Does `resolvePaths` return undefined when no project is found?
      design-risk:
        pass: no
        7: Does `resolvePaths` write to disk itself?
        8: Can `findRoot` loop forever when no folder holds `.mm3` or `.git`?
        9: Does `ensureDir` rewrite the ignore file when it already exists?
    decisions:
      severity:
        pass: [none, low]
        10:
          scale: How severe is the worst issue in this lookup?
          levels: [none, low, medium, high, critical]
      route:
        pass: [ship]
        11:
          choice: Where should this lookup go?
          options: [ship, fix, block]
